services:
  - type: web
    name: desi-job-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: BRAND_COLOR
        value: "#17324D"
      # Required in production: website CMS edits are persisted to MongoDB
      # (Render's filesystem is wiped on every deploy/restart).
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: desijobs_prod
      - key: SECRET_KEY
        generateValue: true
      # Admin login for the CMS / admin panel — set a strong, private password in the Render dashboard.
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: XAI_API_KEY
        sync: false
